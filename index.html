<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samåk Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --ground:#F6F8F8;
  --card:#FFFFFF;
  --ink:#1E2B30;
  --muted:#5F7178;
  --faint:#8A9AA0;
  --line:#E1E8E9;
  --accent:#14657A;
  --accent-soft:#E8F1F3;
  --route:#C08219;
  --ok:#2E6F4F;
  --ok-soft:#E5F0EA;
  --warn-soft:#FAF0DD;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font:400 16px/1.55 var(--body);
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}

.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:10px 16px}
.skip:focus{left:0;z-index:50}

.note{
  background:var(--warn-soft);
  border-bottom:1px solid var(--line);
  padding:8px 24px;
  font-size:.84rem;
  color:var(--muted);
}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr)}

.top{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:14px 24px;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.brand span{color:var(--faint);font-weight:400}
.who{font-size:.88rem;color:var(--muted)}

nav.rail{
  background:var(--card);
  border-right:1px solid var(--line);
  padding:20px 12px 40px;
}
.rail-group+.rail-group{margin-top:22px}
.rail-label{
  display:block;padding:0 10px 8px;
  font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;
}
.rail a{
  display:block;padding:7px 10px;border-radius:5px;
  color:var(--muted);text-decoration:none;font-size:.9rem;
}
.rail a:hover{background:var(--ground);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{padding:28px 24px 64px;min-width:0}
.page{max-width:840px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-direction:column;gap:5px}
.head .sub{color:var(--muted)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:20px;display:flex;flex-direction:column;gap:14px;
}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}

.btn{
  font:600 .9rem/1 var(--body);border-radius:5px;padding:10px 15px;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;border:1px solid transparent;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.plain{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.plain:hover{border-color:var(--faint)}
.btn.sm{padding:7px 11px;font-size:.82rem}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.input{
  font:400 .95rem/1.4 var(--body);color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:5px;
  padding:10px 12px;width:100%;
}
.hint{font-size:.8rem;color:var(--faint)}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick button{
  border:1px solid var(--line);border-radius:5px;padding:11px 13px;background:var(--card);
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;
}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick strong{font-size:.92rem}
.pick span{font-size:.79rem;color:var(--muted)}

.tag{
  display:inline-flex;align-items:center;
  font:600 .72rem/1 var(--body);padding:5px 9px;border-radius:999px;
  background:var(--ground);color:var(--muted);
}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.seat{background:var(--warn-soft);color:#8A5C12;font-family:var(--mono)}

/* route line */
.route-wrap{overflow-x:auto}
.route{
  list-style:none;margin:0;padding:6px 0 0;
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(88px,1fr);min-width:100%;
}
.stop{display:grid;grid-template-rows:auto 14px auto;justify-items:center;position:relative;padding:0 4px;text-align:center}
.stop .t{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.stop .d{width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--line);align-self:center;z-index:1}
.stop .n{font-size:.79rem;color:var(--muted);margin-top:3px}
.stop::after{content:"";position:absolute;top:calc(50% - 1px);left:50%;right:-50%;height:2px;background:var(--line)}
.stop:last-child::after{display:none}
.stop.on .d{background:var(--route);border-color:var(--route)}
.stop.on .n{color:var(--ink);font-weight:600}
.stop.link::after{background:var(--route)}
.route-key{font-size:.78rem;color:var(--faint);margin-top:8px}

.ride{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.ride-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.driver{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.82rem;flex:none}
.meta{font-size:.82rem;color:var(--muted)}
.when{text-align:right}
.when .t{font-family:var(--mono);font-size:1.05rem}
.when .d{font-size:.78rem;color:var(--faint)}
.ride-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-weight:600}
.sub{font-size:.84rem;color:var(--muted)}

a.notif{display:flex;gap:12px;flex:1;text-decoration:none;color:inherit;align-items:flex-start}
a.notif:hover .title{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--route);margin-top:8px;flex:none}
.dot.read{background:var(--line)}

dl.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 18px;font-size:.9rem;margin:0}
dl.kv dt{color:var(--faint);font-size:.8rem;font-weight:600;padding-top:2px}
dl.kv dd{margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
a.tile{
  display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:8px;background:var(--card);padding:14px 16px;
}
a.tile:hover{border-color:var(--accent)}
a.tile strong{font-size:.95rem}
a.tile span{font-size:.82rem;color:var(--muted)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:16px;overflow-x:auto;padding:10px 16px}
  .rail-group+.rail-group{margin-top:0}
  .rail-group{display:flex;align-items:center;gap:6px}
  .rail-label{padding:0 4px 0 0;white-space:nowrap}
  .rail a{white-space:nowrap}
  main{padding:22px 16px 48px}
  .note{padding:8px 16px}
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div class="note">Prototype — navigation and layout only. Nothing is saved and no data is real.</div>

<div class="shell">
  <header class="top">
    <a class="brand" href="#/">Samåk <span>prototype</span></a>
    <span class="who">Signed in as Amelia Ek</span>
  </header>
  <nav class="rail" id="rail" aria-label="Screens"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
(function () {

  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  /* ---------- data ---------- */

  var RIDES = {
    'R-104': {
      id: 'R-104', name: 'Erik Hovander', initials: 'EH', car: 'Volvo V60',
      date: 'Sat 13 Sep', seatsFree: 2, seatsTotal: 3,
      stops: [
        { n: 'Malmö C', t: '07:40' }, { n: 'Lomma', t: '07:56' }, { n: 'Bjärred', t: '08:04' },
        { n: 'Landskrona', t: '08:19' }, { n: 'Helsingborg', t: '08:41' }
      ]
    },
    'R-118': {
      id: 'R-118', name: 'Nina Aronsson', initials: 'NA', car: 'VW ID.4',
      date: 'Sat 13 Sep', seatsFree: 2, seatsTotal: 4,
      stops: [
        { n: 'Malmö C', t: '08:10' }, { n: 'Lund C', t: '08:28' }, { n: 'Eslöv', t: '08:47' },
        { n: 'Höör', t: '09:02' }, { n: 'Hässleholm', t: '09:24' }
      ]
    },
    'R-131': {
      id: 'R-131', name: 'Sanna Tell', initials: 'ST', car: 'Kia Ceed',
      date: 'Sat 13 Sep', seatsFree: 1, seatsTotal: 4,
      stops: [
        { n: 'Malmö C', t: '07:15' }, { n: 'Lomma', t: '07:31' },
        { n: 'Bjärred', t: '07:39' }, { n: 'Landskrona', t: '07:58' }
      ]
    }
  };

  /* ---------- pieces ---------- */

  function head(title, sub, actions) {
    return '<div class="head"><div class="head-row"><div class="head">' +
      '<h1>' + title + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') +
      '</div>' + (actions ? '<div class="row">' + actions + '</div>' : '') + '</div></div>';
  }

  function route(stops, from, to) {
    var a = -1, b = -1;
    stops.forEach(function (s, i) { if (s.n === from) a = i; if (s.n === to) b = i; });
    var items = stops.map(function (s, i) {
      var c = 'stop';
      if (a > -1 && i >= a && i <= b) c += ' on';
      if (a > -1 && i >= a && i < b) c += ' link';
      return '<li class="' + c + '"><span class="t">' + esc(s.t) + '</span>' +
        '<span class="d"></span><span class="n">' + esc(s.n) + '</span></li>';
    }).join('');
    var key = (a > -1 && !(a === 0 && b === stops.length - 1))
      ? '<p class="route-key">Highlighted: your part of the trip, ' + esc(from) + ' to ' + esc(to) + '.</p>' : '';
    return '<div class="route-wrap"><ol class="route">' + items + '</ol></div>' + key;
  }

  function seats(free, total) {
    return '<span class="tag ' + (free ? 'ok' : '') + '">' + free + ' of ' + total + ' seats free</span>';
  }

  function rideCard(r, from, to, href) {
    var last = r.stops[r.stops.length - 1];
    return '<article class="ride">' +
      '<div class="ride-top"><div class="driver"><span class="av">' + esc(r.initials) + '</span>' +
      '<div><div class="title">' + esc(r.name) + '</div>' +
      '<div class="meta">' + esc(r.car) + '</div></div></div>' +
      '<div class="when"><div class="t">' + esc(r.stops[0].t) + '–' + esc(last.t) + '</div>' +
      '<div class="d">' + esc(r.date) + '</div></div></div>' +
      route(r.stops, from, to) +
      '<div class="ride-foot">' + seats(r.seatsFree, r.seatsTotal) +
      (href ? '<a class="btn plain sm" href="' + href + '">View ride</a>' : '') + '</div>' +
      '</article>';
  }

  function page(parts) { return '<div class="page">' + parts.join('') + '</div>'; }

  /* ---------- screens ---------- */

  var SCREENS = [];
  function screen(s) { SCREENS.push(s); }

  screen({
    path: '#/', group: 'Prototype', label: 'Start', render: function () {
      var tiles = SCREENS.filter(function (s) { return s.path !== '#/'; }).map(function (s) {
        return '<a class="tile" href="' + s.path + '"><strong>' + esc(s.label) + '</strong>' +
          '<span>' + esc(s.blurb || '') + '</span></a>';
      }).join('');
      return page([
        head('Carpooling prototype',
          'Twelve screens covering the main passenger and driver flows. Links navigate; nothing else works.'),
        '<div class="grid">' + tiles + '</div>'
      ]);
    }
  });

  screen({
    path: '#/signin', group: 'Passenger', label: 'Sign in', blurb: 'One sign-in for both roles.',
    render: function () {
      return page([
        head('Sign in'),
        '<div class="card" style="max-width:420px">' +
          '<div class="field"><label for="e">E-mail</label>' +
          '<input class="input" id="e" type="email" value="amelia.ek@example.se"></div>' +
          '<div class="field"><label for="p">Password</label>' +
          '<input class="input" id="p" type="password" value="password"></div>' +
          '<div class="row end"><a class="btn plain" href="#/signup">Create account</a>' +
          '<a class="btn primary" href="#/search">Sign in</a></div>' +
        '</div>'
      ]);
    }
  });

  screen({
    path: '#/signup', group: 'Passenger', label: 'Create account', blurb: 'Name, e-mail and how you will use it.',
    render: function () {
      return page([
        head('Create account'),
        '<div class="two">' +
          '<div class="card">' +
            '<div class="field"><label for="n">Full name</label>' +
            '<input class="input" id="n" type="text" value="Amelia Ek"></div>' +
            '<div class="field"><label for="m">E-mail</label>' +
            '<input class="input" id="m" type="email" value="amelia.ek@example.se"></div>' +
            '<div class="field"><label for="w">Password</label>' +
            '<input class="input" id="w" type="password" value="password"></div>' +
            '<div class="field"><label for="h">Home location</label>' +
            '<select class="input" id="h"><option>Malmö C</option><option selected>Lund C</option>' +
            '<option>Landskrona</option><option>Helsingborg</option></select>' +
            '<span class="hint">Picked from a list, not typed.</span></div>' +
          '</div>' +
          '<div class="card">' +
            '<h2>How will you use it?</h2>' +
            '<div class="pick">' +
              '<button type="button" aria-pressed="false"><strong>Passenger</strong><span>Book seats.</span></button>' +
              '<button type="button" aria-pressed="false"><strong>Driver</strong><span>Offer seats.</span></button>' +
              '<button type="button" aria-pressed="true"><strong>Both</strong><span>Switch any time.</span></button>' +
            '</div>' +
            '<div class="row end"><a class="btn primary" href="#/search">Create account</a></div>' +
          '</div>' +
        '</div>'
      ]);
    }
  });

  screen({
    path: '#/search', group: 'Passenger', label: 'Find a ride', blurb: 'From, to, date and seats.',
    render: function () {
      return page([
        head('Find a ride'),
        '<div class="card">' +
          '<div class="two">' +
            '<div class="field"><label for="f">From</label><select class="input" id="f">' +
            '<option selected>Malmö C</option><option>Lund C</option><option>Lomma</option></select></div>' +
            '<div class="field"><label for="t">To</label><select class="input" id="t">' +
            '<option selected>Helsingborg</option><option>Landskrona</option><option>Hässleholm</option></select></div>' +
            '<div class="field"><label for="d">Date</label><input class="input" id="d" type="date" value="2026-09-13"></div>' +
            '<div class="field"><label for="ti">Earliest departure</label><input class="input" id="ti" type="time" value="07:00"></div>' +
            '<div class="field"><label for="s">Seats</label><select class="input" id="s">' +
            '<option selected>1</option><option>2</option></select></div>' +
            '<div class="field"><label for="pp">Partial trips</label><select class="input" id="pp">' +
            '<option selected>Include rides going part of the way</option>' +
            '<option>Only rides all the way</option></select></div>' +
          '</div>' +
          '<div class="row end"><a class="btn primary" href="#/results">Search</a></div>' +
        '</div>'
      ]);
    }
  });

  screen({
    path: '#/results', group: 'Passenger', label: 'Matching rides', blurb: 'Full and partial matches.',
    render: function () {
      return page([
        head('Malmö C to Helsingborg', 'Sat 13 Sep, from 07:00, 1 seat. Three rides match.',
          '<a class="btn plain sm" href="#/search">Change search</a>'),
        rideCard(RIDES['R-104'], 'Malmö C', 'Helsingborg', '#/ride'),
        rideCard(RIDES['R-131'], 'Malmö C', 'Landskrona', '#/ride'),
        rideCard(RIDES['R-118'], 'Malmö C', 'Lund C', '#/ride')
      ]);
    }
  });

  screen({
    path: '#/ride', group: 'Passenger', label: 'Ride detail', blurb: 'Route, driver and the seat request.',
    render: function () {
      var r = RIDES['R-104'];
      return page([
        head('Malmö C to Helsingborg', 'Sat 13 Sep, departs 07:40.',
          '<a class="btn plain sm" href="#/results">Back to results</a>'),
        '<div class="card">' +
          '<div class="ride-top"><div class="driver"><span class="av">EH</span>' +
          '<div><div class="title">Erik Hovander</div><div class="meta">Volvo V60</div></div></div>' +
          seats(r.seatsFree, r.seatsTotal) + '</div>' +
          route(r.stops, 'Malmö C', 'Helsingborg') +
        '</div>',
        '<div class="two">' +
          '<div class="card"><h2>Book a seat</h2>' +
            '<div class="field"><label for="on">Get on at</label><select class="input" id="on">' +
            r.stops.map(function (s, i) {
              return '<option' + (i === 0 ? ' selected' : '') + '>' + esc(s.n) + '</option>';
            }).join('') + '</select></div>' +
            '<div class="field"><label for="off">Get off at</label><select class="input" id="off">' +
            r.stops.map(function (s, i) {
              return '<option' + (i === r.stops.length - 1 ? ' selected' : '') + '>' + esc(s.n) + '</option>';
            }).join('') + '</select></div>' +
            '<div class="row end"><a class="btn primary" href="#/bookings">Request seat</a></div>' +
            '<p class="hint">The driver accepts or declines. You get a notification.</p>' +
          '</div>' +
          '<div class="card"><h2>Who else is coming</h2>' +
            '<ul class="list"><li><span class="av">TÅ</span><div class="body">' +
            '<span class="title">Tove Åkesson</span>' +
            '<span class="sub">Malmö C to Landskrona</span></div>' +
            '<span class="tag ok">Confirmed</span></li></ul>' +
          '</div>' +
        '</div>'
      ]);
    }
  });

  screen({
    path: '#/bookings', group: 'Passenger', label: 'My bookings', blurb: 'Upcoming trips and history.',
    render: function () {
      function row(b) {
        return '<tr><td>' + esc(b[0]) + '</td><td class="num">' + esc(b[1]) + '</td><td>' + esc(b[2]) +
          '</td><td>' + b[3] + '</td><td>' + (b[4] ? '<a class="btn plain sm" href="#/bookings">Cancel</a>' : '') + '</td></tr>';
      }
      var up = [
        ['Malmö C to Helsingborg', 'Sat 13 Sep 07:40', 'Erik Hovander', '<span class="tag">Awaiting driver</span>', 1],
        ['Lund C to Höör', 'Sun 14 Sep 08:28', 'Nina Aronsson', '<span class="tag ok">Confirmed</span>', 1]
      ];
      var past = [
        ['Malmö C to Lund C', 'Fri 5 Sep 17:05', 'Nina Aronsson', '<span class="tag">Completed</span>', 0],
        ['Landskrona to Helsingborg', 'Tue 2 Sep 07:15', 'Erik Hovander', '<span class="tag">Cancelled</span>', 0]
      ];
      function table(rows) {
        return '<div class="tbl-wrap"><table><thead><tr><th>Trip</th><th class="num">Departs</th>' +
          '<th>Driver</th><th>State</th><th></th></tr></thead><tbody>' +
          rows.map(row).join('') + '</tbody></table></div>';
      }
      return page([
        head('My bookings', null, '<a class="btn primary sm" href="#/search">Find a ride</a>'),
        '<div class="card"><h2>Upcoming</h2>' + table(up) + '</div>',
        '<div class="card"><h2>Past</h2>' + table(past) + '</div>'
      ]);
    }
  });

  screen({
    path: '#/notifications', group: 'Passenger', label: 'Notifications', blurb: 'Each one opens what it is about.',
    render: function () {
      var items = [
        [1, 'Erik Hovander accepted your seat request', 'Malmö C to Helsingborg, Sat 13 Sep 07:40.', '12 min ago', '#/ride'],
        [1, 'A passenger joined your trip', 'Oskar Lejon booked Lomma to Landskrona.', '40 min ago', '#/driver/trip'],
        [1, 'Departure time changed', 'R-118 now leaves Malmö C at 08:10.', '3 h ago', '#/ride'],
        [0, 'Trip completed', 'Rate your ride with Nina Aronsson.', 'Fri 5 Sep', '#/bookings'],
        [0, 'Booking cancelled by driver', 'Landskrona to Helsingborg, Tue 2 Sep.', 'Mon 1 Sep', '#/bookings']
      ].map(function (n) {
        return '<li><a class="notif" href="' + n[4] + '">' +
          '<span class="dot' + (n[0] ? '' : ' read') + '"></span>' +
          '<span class="body"><span class="title">' + esc(n[1]) + '</span>' +
          '<span class="sub">' + esc(n[2]) + '</span></span>' +
          '<span class="meta">' + esc(n[3]) + '</span></a></li>';
      }).join('');
      return page([
        head('Notifications'),
        '<div class="card"><ul class="list">' + items + '</ul></div>'
      ]);
    }
  });

  screen({
    path: '#/driver', group: 'Driver', label: 'My trips', blurb: 'What a driver sees first.',
    render: function () {
      var r = RIDES['R-104'];
      return page([
        head('My trips', null, '<a class="btn primary sm" href="#/driver/publish">Publish a ride</a>'),
        '<div class="card"><div class="ride-top"><h2>Saturday 13 September</h2>' +
          '<span class="tag">2 requests waiting</span></div>' +
          route(r.stops) +
          '<div class="ride-foot">' + seats(r.seatsFree, r.seatsTotal) +
          '<div class="row"><a class="btn plain sm" href="#/driver/trip">Trip detail</a>' +
          '<a class="btn primary sm" href="#/driver/requests">Answer requests</a></div></div>' +
        '</div>',
        '<div class="card"><h2>Later this week</h2><ul class="list">' +
          '<li><div class="body"><span class="title">Lund C to Ystad</span>' +
          '<span class="sub">Sun 14 Sep 16:20 · 3 seats free</span></div>' +
          '<a class="btn plain sm" href="#/driver/trip">Open</a></li>' +
          '<li><div class="body"><span class="title">Malmö C to Lund C</span>' +
          '<span class="sub">Mon 15 Sep 07:50 · 2 seats free</span></div>' +
          '<a class="btn plain sm" href="#/driver/trip">Open</a></li>' +
        '</ul></div>'
      ]);
    }
  });

  screen({
    path: '#/driver/publish', group: 'Driver', label: 'Publish a ride', blurb: 'Route, stops, time and seats.',
    render: function () {
      return page([
        head('Publish a ride'),
        '<div class="two">' +
          '<div class="card">' +
            '<div class="field"><label for="pf">From</label><select class="input" id="pf">' +
            '<option selected>Malmö C</option></select></div>' +
            '<div class="field"><label for="pt">To</label><select class="input" id="pt">' +
            '<option selected>Helsingborg</option></select></div>' +
            '<div class="field"><label>Stops along the way</label><div class="pick">' +
              '<button type="button" aria-pressed="true"><strong>Lomma</strong><span>+16 min</span></button>' +
              '<button type="button" aria-pressed="true"><strong>Bjärred</strong><span>+8 min</span></button>' +
              '<button type="button" aria-pressed="true"><strong>Landskrona</strong><span>+15 min</span></button>' +
            '</div><span class="hint">Stops are what let people join partway.</span></div>' +
            '<div class="two">' +
              '<div class="field"><label for="pd">Date</label><input class="input" id="pd" type="date" value="2026-09-13"></div>' +
              '<div class="field"><label for="pti">Departure</label><input class="input" id="pti" type="time" value="07:40"></div>' +
              '<div class="field"><label for="ps">Free seats</label><select class="input" id="ps">' +
              '<option>1</option><option>2</option><option selected>3</option></select></div>' +
            '</div>' +
            '<div class="row end"><a class="btn primary" href="#/driver/trip">Publish</a></div>' +
          '</div>' +
          '<div class="card"><h2>Preview</h2>' + route(RIDES['R-104'].stops) + '</div>' +
        '</div>'
      ]);
    }
  });

  screen({
    path: '#/driver/requests', group: 'Driver', label: 'Booking requests', blurb: 'Accept or decline a seat.',
    render: function () {
      var r = RIDES['R-104'];
      var reqs = [
        { name: 'Amelia Ek', i: 'AE', from: 'Malmö C', to: 'Helsingborg', when: '2 h ago' },
        { name: 'Oskar Lejon', i: 'OL', from: 'Lomma', to: 'Landskrona', when: '40 min ago' }
      ].map(function (q) {
        return '<article class="ride">' +
          '<div class="ride-top"><div class="driver"><span class="av">' + esc(q.i) + '</span>' +
          '<div><div class="title">' + esc(q.name) + '</div>' +
          '<div class="meta">Asked ' + esc(q.when) + '</div></div></div>' +
          '<span class="tag seat">1 seat</span></div>' +
          route(r.stops, q.from, q.to) +
          '<div class="ride-foot"><span class="meta">Takes a seat only between ' + esc(q.from) +
          ' and ' + esc(q.to) + '.</span>' +
          '<div class="row"><a class="btn plain sm" href="#/driver/requests">Decline</a>' +
          '<a class="btn primary sm" href="#/driver/trip">Accept</a></div></div>' +
          '</article>';
      }).join('');
      return page([
        head('Requests for Saturday', 'Malmö C to Helsingborg, departs 07:40.',
          '<a class="btn plain sm" href="#/driver">Back to trips</a>'),
        reqs
      ]);
    }
  });

  screen({
    path: '#/driver/trip', group: 'Driver', label: 'Trip & passengers', blurb: 'Who gets on where.',
    render: function () {
      var r = RIDES['R-104'];
      var rows = [
        ['07:40', 'Malmö C', 'Amelia Ek', ''],
        ['07:56', 'Lomma', 'Oskar Lejon', ''],
        ['08:04', 'Bjärred', '', ''],
        ['08:19', 'Landskrona', '', 'Tove Åkesson, Oskar Lejon'],
        ['08:41', 'Helsingborg', '', 'Amelia Ek']
      ].map(function (m) {
        return '<tr><td class="num">' + esc(m[0]) + '</td><td>' + esc(m[1]) + '</td>' +
          '<td>' + (m[2] ? esc(m[2]) : '—') + '</td><td>' + (m[3] ? esc(m[3]) : '—') + '</td></tr>';
      }).join('');
      return page([
        head('Saturday 13 September', 'Malmö C to Helsingborg. Three passengers.',
          '<a class="btn plain sm" href="#/driver">Back to trips</a>'),
        '<div class="card">' + route(r.stops) + '<div class="row">' + seats(1, 3) + '</div></div>',
        '<div class="card"><h2>Pickup order</h2>' +
          '<div class="tbl-wrap"><table><thead><tr><th class="num">Time</th><th>Stop</th>' +
          '<th>Picks up</th><th>Drops off</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '</div>'
      ]);
    }
  });

  /* ---------- shell ---------- */

  var ROUTES = {};
  SCREENS.forEach(function (s) { ROUTES[s.path] = s; });

  var rail = document.getElementById('rail');
  var main = document.getElementById('main');
  var path = '#/';

  (function buildRail() {
    var groups = [], byName = {};
    SCREENS.forEach(function (s) {
      if (!byName[s.group]) { byName[s.group] = []; groups.push(s.group); }
      byName[s.group].push(s);
    });
    rail.innerHTML = groups.map(function (g) {
      return '<div class="rail-group"><span class="rail-label">' + esc(g) + '</span>' +
        byName[g].map(function (s) {
          return '<a href="' + s.path + '" data-path="' + s.path + '">' + esc(s.label) + '</a>';
        }).join('') + '</div>';
    }).join('');
  })();

  function render() {
    var s = ROUTES[path];
    main.innerHTML = s ? s.render() : page([head('Not part of this prototype',
      'Nothing here answers to that link. <a href="#/">Back to the start</a>.')]);
    Array.prototype.forEach.call(rail.querySelectorAll('a'), function (a) {
      if (a.getAttribute('data-path') === path) { a.setAttribute('aria-current', 'page'); }
      else { a.removeAttribute('aria-current'); }
    });
    document.title = (s && s.path !== '#/' ? s.label + ' — ' : '') + 'Samåk Prototype';
    main.focus();
    window.scrollTo(0, 0);
  }

  /* Capture phase, and the path is held here rather than read from location.hash:
     embedded in a sandboxed frame neither the hash nor bubbled clicks are reliable. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
    e.preventDefault();
    e.stopPropagation();
    var next = a.getAttribute('href');
    if (next === path) { return; }
    path = next;
    render();
    try { if (location.hash !== next) { location.hash = next; } } catch (err) {}
  }, true);

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.pick button') : null;
    if (!b) { return; }
    Array.prototype.forEach.call(b.parentNode.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
  });

  window.addEventListener('hashchange', function () {
    var h = location.hash;
    if (h && h !== path && ROUTES[h]) { path = h; render(); }
  });

  try { if (location.hash && ROUTES[location.hash]) { path = location.hash; } } catch (e) {}
  render();
})();
</script>
</body>
</html>
