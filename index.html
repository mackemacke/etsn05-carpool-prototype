<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samåk Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --ground:#EFF2F2;
  --card:#FFFFFF;
  --ink:#1E2B30;
  --muted:#5F7178;
  --faint:#8A9AA0;
  --line:#E1E8E9;
  --accent:#14657A;
  --accent-soft:#E8F1F3;
  --route:#C08219;
  --route-soft:#FAF0DD;
  --ok:#2E6F4F;
  --ok-soft:#E5F0EA;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:10px 16px}
.skip:focus{left:0;z-index:60}

/* ============ prototype chrome (outside the frames) ============ */

.note{background:var(--route-soft);border-bottom:1px solid var(--line);padding:8px 24px;font-size:.84rem;color:var(--muted)}
.shell{display:grid;grid-template-columns:206px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.brand span{color:var(--faint);font-weight:400}
.top .meta{font-size:.86rem;color:var(--muted)}

nav.rail{background:var(--card);border-right:1px solid var(--line);padding:20px 12px 40px}
.rail-group+.rail-group{margin-top:22px}
.rail-label{display:block;padding:0 10px 8px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.rail a{display:block;padding:7px 10px;border-radius:5px;color:var(--muted);text-decoration:none;font-size:.9rem}
.rail a:hover{background:var(--ground);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{padding:26px 24px 60px;min-width:0}
.wrap{max-width:1020px;display:flex;flex-direction:column;gap:16px}
.caption h1{font-size:1.35rem}
.caption p{color:var(--muted);margin-top:4px;max-width:70ch}

/* ============ the browser frame ============ */

.frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);
  box-shadow:0 1px 2px rgba(30,43,48,.05),0 14px 32px -22px rgba(30,43,48,.5)}
.stage{position:relative;overflow:hidden;background:var(--ground)}
.screen{width:1280px;height:820px;transform-origin:top left;overflow:hidden;background:#F6F8F8;
  font-size:16px;color:var(--ink);display:flex;flex-direction:column}

/* ============ inside the frame: the product itself ============ */

.screen .bar{display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:0 32px;height:62px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.screen .logo{font-weight:700;font-size:19px;letter-spacing:-.02em}
.screen .menu{display:flex;gap:26px;margin-left:14px}
.screen .menu a{color:var(--muted);text-decoration:none;font-size:15px;padding:4px 0;border-bottom:2px solid transparent}
.screen .menu a.here{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.screen .barleft{display:flex;align-items:center}
.screen .me{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}

.screen .body{flex:1;overflow:hidden;padding:32px}
.screen .col{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.screen .col.wide{max-width:1040px}

.screen .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.screen .ph h2{font-size:26px}
.screen .ph .s{color:var(--muted);font-size:15px;margin-top:3px}

.screen .box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:22px;display:flex;flex-direction:column;gap:16px}
.screen .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.screen .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.screen .r.end{justify-content:flex-end}

.screen .f{display:flex;flex-direction:column;gap:6px}
.screen .f label{font-size:13px;font-weight:600;color:var(--muted)}
.screen .in{border:1px solid var(--line);border-radius:6px;padding:11px 13px;font-size:15px;background:#fff;color:var(--ink)}
.screen .in.soft{color:var(--faint)}
.screen .hint{font-size:13px;color:var(--faint)}
.screen .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.screen .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.screen a{text-decoration:none}
.screen .b{display:inline-flex;cursor:pointer;align-items:center;border-radius:6px;padding:11px 18px;font-size:15px;font-weight:600}
.screen .b.pri{background:var(--accent);color:#fff}
.screen .b.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.screen .b.sm{padding:8px 13px;font-size:13.5px}

.screen .chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:var(--ground);color:var(--muted)}
.screen .chip.ok{background:var(--ok-soft);color:var(--ok)}
.screen .chip.warn{background:var(--route-soft);color:#8A5C12}

.screen .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.screen .av.sm{width:30px;height:30px;font-size:12px}

.screen .rt{list-style:none;margin:0;padding:4px 0 0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.screen .rt li{display:grid;grid-template-rows:auto 14px auto;justify-items:center;position:relative;text-align:center}
.screen .rt .t{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.screen .rt .d{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line);align-self:center;z-index:1}
.screen .rt .n{font-size:13.5px;color:var(--muted);margin-top:4px}
.screen .rt li::after{content:"";position:absolute;top:calc(50% - 1px);left:50%;right:-50%;height:2px;background:var(--line)}
.screen .rt li:last-child::after{display:none}
.screen .rt li.on .d{background:var(--route);border-color:var(--route)}
.screen .rt li.on .n{color:var(--ink);font-weight:600}
.screen .rt li.lk::after{background:var(--route)}

.screen table{border-collapse:collapse;width:100%;font-size:14.5px}
.screen th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  text-align:left;padding:0 12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.screen td{padding:12px;border-bottom:1px solid var(--line)}
.screen tr:last-child td{border-bottom:0}
.screen td.m,.screen th.m{font-family:var(--mono);font-variant-numeric:tabular-nums}

.screen ul.l{list-style:none;margin:0;padding:0}
.screen ul.l li{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.screen ul.l li:last-child{border-bottom:0}
.screen .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;color:inherit}
.screen a.tx:hover .tt{color:var(--accent)}
.screen .tt{font-weight:600;font-size:15px}
.screen .ss{font-size:13.5px;color:var(--muted)}
.screen .dot{width:7px;height:7px;border-radius:50%;background:var(--route);flex:none}
.screen .dot.off{background:var(--line)}

/* auth screens: full-bleed, centred */
.screen.auth{background:#F1F5F5;align-items:center;justify-content:center;padding:0}
.screen.auth .pane{width:440px;display:flex;flex-direction:column;gap:18px}
.screen.auth .pane.wide{width:720px}
.screen.auth .mark{text-align:center;font-weight:700;font-size:24px;letter-spacing:-.02em}
.screen.auth .mark span{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:16px;overflow-x:auto;padding:10px 16px}
  .rail-group+.rail-group{margin-top:0}
  .rail-group{display:flex;align-items:center;gap:6px}
  .rail-label{padding:0 4px 0 0;white-space:nowrap}
  .rail a{white-space:nowrap}
  main{padding:20px 16px 44px}
  .note{padding:8px 16px}
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>
<div class="note">Prototype — each tab shows one screen as it would look full size. Nothing is saved and no data is real.</div>

<div class="shell">
  <header class="top">
    <a class="brand" href="#/">Samåk <span>screens</span></a>
    <span class="meta">ETSN05 Team 2 · phase 1</span>
  </header>
  <nav class="rail" id="rail" aria-label="Screens"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
(function () {

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  var STOPS = [
    { n: 'Malmö C', t: '07:40' }, { n: 'Lomma', t: '07:56' }, { n: 'Bjärred', t: '08:04' },
    { n: 'Landskrona', t: '08:19' }, { n: 'Helsingborg', t: '08:41' }
  ];
  var STOPS_B = [
    { n: 'Malmö C', t: '08:10' }, { n: 'Lund C', t: '08:28' }, { n: 'Eslöv', t: '08:47' },
    { n: 'Höör', t: '09:02' }, { n: 'Hässleholm', t: '09:24' }
  ];
  var STOPS_C = [
    { n: 'Malmö C', t: '07:15' }, { n: 'Lomma', t: '07:31' },
    { n: 'Bjärred', t: '07:39' }, { n: 'Landskrona', t: '07:58' }
  ];

  function rt(stops, from, to) {
    var a = -1, b = -1;
    stops.forEach(function (s, i) { if (s.n === from) a = i; if (s.n === to) b = i; });
    return '<ol class="rt">' + stops.map(function (s, i) {
      var c = [];
      if (a > -1 && i >= a && i <= b) c.push('on');
      if (a > -1 && i >= a && i < b) c.push('lk');
      return '<li class="' + c.join(' ') + '"><span class="t">' + esc(s.t) + '</span>' +
        '<span class="d"></span><span class="n">' + esc(s.n) + '</span></li>';
    }).join('') + '</ol>';
  }

  /* the product's own chrome, drawn inside the frame */
  function app(active, role, content) {
    var items = role === 'driver'
      ? [['My trips', 'trips', '#/driver'], ['Publish a ride', 'publish', '#/publish'],
         ['Requests', 'requests', '#/requests']]
      : [['Find a ride', 'find', '#/find'], ['My bookings', 'bookings', '#/bookings'],
         ['Notifications', 'notif', '#/notifications']];
    return '<header class="bar"><div class="barleft"><span class="logo">Samåk</span>' +
      '<nav class="menu">' + items.map(function (i) {
        return '<a href="' + i[2] + '" class="' + (i[1] === active ? 'here' : '') + '">' +
          esc(i[0]) + '</a>';
      }).join('') + '</nav></div>' +
      '<span class="me"><span class="av sm">AE</span>Alice Ek</span></header>' +
      '<div class="body">' + content + '</div>';
  }

  function ph(title, sub, right) {
    return '<div class="ph"><div><h2>' + title + '</h2>' +
      (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>' +
      (right ? '<div class="r">' + right + '</div>' : '') + '</div>';
  }

  function ride(name, initials, car, times, date, seats, stops, from, to) {
    return '<div class="box">' +
      '<div class="ph"><div class="r"><span class="av">' + esc(initials) + '</span>' +
      '<div><div class="tt">' + esc(name) + '</div><div class="ss">' + esc(car) + '</div></div></div>' +
      '<div style="text-align:right"><div style="font-family:var(--mono);font-size:17px">' + esc(times) + '</div>' +
      '<div class="ss">' + esc(date) + '</div></div></div>' +
      rt(stops, from, to) +
      '<div class="ph"><span class="chip ok">' + esc(seats) + '</span>' +
      '<a class="b sec sm" href="#/ride">View ride</a></div>' +
      '</div>';
  }

  /* ---------- screens ---------- */

  var SCREENS = [];
  function screen(s) { SCREENS.push(s); }

  screen({
    path: '#/', group: 'Prototype', label: 'All screens',
    title: 'Screen designs',
    lede: 'Eleven screens, each shown as it would look on a full display. Pick one from the list to see it.',
    index: true
  });

  screen({
    path: '#/signin', group: 'Passenger', label: 'Sign in', url: 'samak.se/sign-in',
    title: 'Sign in', lede: 'One sign-in for both roles. Where you land after depends on the role on your account.',
    auth: true,
    render: function () {
      return '<div class="pane">' +
        '<div class="mark">Samåk<span>Share the ride, split the drive</span></div>' +
        '<div class="box">' +
          '<div class="f"><label>E-mail</label><div class="in">alice.ek@example.se</div></div>' +
          '<div class="f"><label>Password</label><div class="in">••••••••••</div></div>' +
          '<a class="b pri" href="#/find" style="justify-content:center">Sign in</a>' +
          '<div class="ss" style="text-align:center">New here? <a href="#/signup" style="color:var(--accent);font-weight:600">Create an account</a></div>' +
        '</div>' +
      '</div>';
    }
  });

  screen({
    path: '#/signup', group: 'Passenger', label: 'Create account', url: 'samak.se/create-account',
    title: 'Create account', lede: 'Registration asks how you intend to use it — driver, passenger or both. The role lives on the account, not on two separate logins.',
    auth: true,
    render: function () {
      return '<div class="pane wide">' +
        '<div class="mark">Create your account</div>' +
        '<div class="box">' +
          '<div class="grid2">' +
            '<div class="f"><label>Full name</label><div class="in">Alice Ek</div></div>' +
            '<div class="f"><label>E-mail</label><div class="in">alice.ek@example.se</div></div>' +
            '<div class="f"><label>Password</label><div class="in">••••••••••</div></div>' +
            '<div class="f"><label>Home location</label><div class="in">Lund C</div>' +
            '<span class="hint">Chosen from the list of locations.</span></div>' +
          '</div>' +
          '<div class="f"><label>How will you use Samåk?</label>' +
            '<div class="grid3">' +
              '<div class="in" style="text-align:center">Passenger</div>' +
              '<div class="in" style="text-align:center">Driver</div>' +
              '<div class="in" style="text-align:center;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600">Both</div>' +
            '</div>' +
          '</div>' +
          '<div class="r end"><a class="b sec" href="#/signin">Cancel</a><a class="b pri" href="#/find">Create account</a></div>' +
        '</div>' +
      '</div>';
    }
  });

  screen({
    path: '#/find', group: 'Passenger', label: 'Find a ride', url: 'samak.se/find',
    title: 'Find a ride', lede: 'The search. Locations come from a maintained list rather than free text, because matching depends on knowing where each one sits along a route.',
    render: function () {
      return app('find', 'passenger',
        '<div class="col">' +
          ph('Where are you going?', 'Saturday 13 September') +
          '<div class="box">' +
            '<div class="grid2">' +
              '<div class="f"><label>From</label><div class="in">Malmö C</div></div>' +
              '<div class="f"><label>To</label><div class="in">Helsingborg</div></div>' +
            '</div>' +
            '<div class="grid3">' +
              '<div class="f"><label>Date</label><div class="in">13 Sep 2026</div></div>' +
              '<div class="f"><label>Earliest departure</label><div class="in">07:00</div></div>' +
              '<div class="f"><label>Seats</label><div class="in">1</div></div>' +
            '</div>' +
            '<div class="ph"><span class="hint">Rides that cover part of the way are included.</span>' +
            '<a class="b pri" href="#/results">Search</a></div>' +
          '</div>' +
          '<div class="box"><div class="tt">Recent</div>' +
            '<ul class="l">' +
              '<li><div class="tx"><span class="tt">Lund C → Höör</span>' +
              '<span class="ss">Sun 14 Sep · 1 seat</span></div><a class="b sec sm" href="#/results">Search again</a></li>' +
              '<li><div class="tx"><span class="tt">Malmö C → Lund C</span>' +
              '<span class="ss">Fri 5 Sep · 1 seat</span></div><a class="b sec sm" href="#/results">Search again</a></li>' +
            '</ul>' +
          '</div>' +
        '</div>');
    }
  });

  screen({
    path: '#/results', group: 'Passenger', label: 'Matching rides', url: 'samak.se/find/results',
    title: 'Matching rides', lede: 'Full matches and rides that only cover part of the journey, in one list. The amber section of each line is the part you would be in the car.',
    render: function () {
      return app('find', 'passenger',
        '<div class="col wide">' +
          ph('Malmö C to Helsingborg', 'Sat 13 Sep, from 07:00, 1 seat · 3 rides',
            '<a class="b sec sm" href="#/find">Change search</a>') +
          ride('Erik Hovander', 'EH', 'Volvo V60', '07:40–08:41', 'Sat 13 Sep',
            '2 of 3 seats free', STOPS, 'Malmö C', 'Helsingborg') +
          ride('Sanna Tell', 'ST', 'Kia Ceed', '07:15–07:58', 'Sat 13 Sep',
            '1 of 4 seats free', STOPS_C, 'Malmö C', 'Landskrona') +
          ride('Nina Aronsson', 'NA', 'VW ID.4', '08:10–09:24', 'Sat 13 Sep',
            '2 of 4 seats free', STOPS_B, 'Malmö C', 'Lund C') +
        '</div>');
    }
  });

  screen({
    path: '#/ride', group: 'Passenger', label: 'Ride detail', url: 'samak.se/ride/R-104',
    title: 'Ride detail and booking', lede: 'The whole route with times, who is already in the car, and the seat request. Boarding and alighting stop are chosen here, which is what creates a partial booking.',
    render: function () {
      return app('find', 'passenger',
        '<div class="col wide">' +
          ph('Malmö C to Helsingborg', 'Saturday 13 September, departs 07:40',
            '<a class="b sec sm" href="#/results">Back to results</a>') +
          '<div class="box">' +
            '<div class="ph"><div class="r"><span class="av">EH</span>' +
            '<div><div class="tt">Erik Hovander</div><div class="ss">Volvo V60 · 37 trips</div></div></div>' +
            '<span class="chip ok">2 of 3 seats free</span></div>' +
            rt(STOPS, 'Malmö C', 'Helsingborg') +
          '</div>' +
          '<div class="split">' +
            '<div class="box"><div class="tt">Book a seat</div>' +
              '<div class="grid2">' +
                '<div class="f"><label>Get on at</label><div class="in">Malmö C · 07:40</div></div>' +
                '<div class="f"><label>Get off at</label><div class="in">Helsingborg · 08:41</div></div>' +
              '</div>' +
              '<div class="f"><label>Seats</label><div class="in">1</div></div>' +
              '<div class="r end"><a class="b pri" href="#/bookings">Request seat</a></div>' +
              '<span class="hint">The driver accepts or declines. You get a notification either way.</span>' +
            '</div>' +
            '<div class="box"><div class="tt">Who else is coming</div>' +
              '<ul class="l">' +
                '<li><span class="av">TÅ</span><div class="tx"><span class="tt">Tove Åkesson</span>' +
                '<span class="ss">Malmö C → Landskrona</span></div><span class="chip ok">Confirmed</span></li>' +
              '</ul>' +
              '<div class="ss">Non-smoking. Small bags only — the boot has a bike rack.</div>' +
            '</div>' +
          '</div>' +
        '</div>');
    }
  });

  screen({
    path: '#/bookings', group: 'Passenger', label: 'My bookings', url: 'samak.se/bookings',
    title: 'My bookings', lede: 'Upcoming trips and the history behind them. History is what makes the usage figures in the final report possible, so it is not optional.',
    render: function () {
      function rows(list) {
        return list.map(function (b) {
          return '<tr><td>' + esc(b[0]) + '</td><td class="m">' + esc(b[1]) + '</td>' +
            '<td>' + esc(b[2]) + '</td><td>' + b[3] + '</td>' +
            '<td style="text-align:right">' + (b[4] ? '<a class="b sec sm" href="#/bookings">Cancel</a>' : '') + '</td></tr>';
        }).join('');
      }
      return app('bookings', 'passenger',
        '<div class="col wide">' +
          ph('My bookings', null, '<a class="b pri sm" href="#/find">Find a ride</a>') +
          '<div class="box"><div class="tt">Upcoming</div><table>' +
            '<thead><tr><th>Trip</th><th class="m">Departs</th><th>Driver</th><th>State</th><th></th></tr></thead>' +
            '<tbody>' + rows([
              ['Malmö C → Helsingborg', 'Sat 13 Sep 07:40', 'Erik Hovander', '<span class="chip warn">Awaiting driver</span>', 1],
              ['Lund C → Höör', 'Sun 14 Sep 08:28', 'Nina Aronsson', '<span class="chip ok">Confirmed</span>', 1]
            ]) + '</tbody></table></div>' +
          '<div class="box"><div class="tt">Past</div><table>' +
            '<thead><tr><th>Trip</th><th class="m">Departed</th><th>Driver</th><th>State</th><th></th></tr></thead>' +
            '<tbody>' + rows([
              ['Malmö C → Lund C', 'Fri 5 Sep 17:05', 'Nina Aronsson', '<span class="chip">Completed</span>', 0],
              ['Landskrona → Helsingborg', 'Tue 2 Sep 07:15', 'Erik Hovander', '<span class="chip">Cancelled</span>', 0]
            ]) + '</tbody></table></div>' +

  });

  screen({
    path: '#/notifications', group: 'Passenger', label: 'Notifications', url: 'samak.se/notifications',
    title: 'Notifications', lede: 'Every entry opens the ride, booking or trip it refers to. That only works if each notification type has a destination, so the type list and the route list have to be written together.',
    render: function () {
      var items = [
        [1, 'Erik Hovander accepted your seat request', 'Malmö C → Helsingborg, Sat 13 Sep 07:40. Pickup outside the north entrance.', '12 min ago', '#/ride'],
        [1, 'A passenger joined your trip', 'Oskar Lejon booked Lomma → Landskrona.', '40 min ago', '#/trip'],
        [1, 'Departure time changed', 'Your ride to Hässleholm now leaves Malmö C at 08:10.', '3 h ago', '#/ride'],
        [0, 'Trip completed', 'Rate your ride with Nina Aronsson, Malmö C → Lund C.', 'Fri 5 Sep', '#/bookings'],
        [0, 'Booking cancelled by driver', 'Landskrona → Helsingborg on Tue 2 Sep was cancelled.', 'Mon 1 Sep', '#/bookings']
      ].map(function (n) {
        return '<li><span class="dot' + (n[0] ? '' : ' off') + '"></span>' +
          '<a class="tx" href="' + n[4] + '"><span class="tt">' + esc(n[1]) + '</span>' +
          '<span class="ss">' + esc(n[2]) + '</span></a>' +

        '<div class="col">' +
          ph('Notifications', '3 unread', '<a class="b sec sm" href="#/notifications">Mark all as read</a>') +

        '</div>');

  });

  screen({
    path: '#/driver', group: 'Driver', label: 'My trips', url: 'samak.se/driver',
    title: 'Driver home', lede: 'What a driver sees first: today at the top, with anything waiting for an answer surfaced before the detail.',
    render: function () {
      return app('trips', 'driver',
        '<div class="col wide">' +
          ph('Your trips', 'Driving as Alice Ek', '<a class="b pri sm" href="#/publish">Publish a ride</a>') +
          '<div class="box">' +
            '<div class="ph"><div><div class="tt">Saturday 13 September</div>' +
            '<div class="ss">Malmö C → Helsingborg, departs 07:40</div></div>' +
            '<span class="chip warn">2 requests waiting</span></div>' +
            rt(STOPS) +
            '<div class="ph"><span class="chip ok">1 of 3 seats free</span>' +
            '<span class="r"><a class="b sec sm" href="#/trip">Trip detail</a>' +
            '<a class="b pri sm" href="#/requests">Answer requests</a></span></div>' +
          '</div>' +
          '<div class="box"><div class="tt">Later this week</div>' +
            '<ul class="l">' +
              '<li><div class="tx"><span class="tt">Lund C → Ystad</span>' +
              '<span class="ss">Sun 14 Sep 16:20 · 3 seats free · no requests</span></div>' +
              '<a class="b sec sm" href="#/trip">Open</a></li>' +
              '<li><div class="tx"><span class="tt">Malmö C → Lund C</span>' +
              '<span class="ss">Mon 15 Sep 07:50 · 2 seats free · 1 passenger</span></div>' +
              '<a class="b sec sm" href="#/trip">Open</a></li>' +
            '</ul>' +
          '</div>' +
        '</div>');
    }
  });

  screen({
    path: '#/publish', group: 'Driver', label: 'Publish a ride', url: 'samak.se/driver/publish',
    title: 'Publish a ride', lede: 'The stops between origin and destination are the point of this screen. Without them nobody can ever join halfway.',
    render: function () {
      return app('publish', 'driver',
        '<div class="col wide">' +
          ph('Publish a ride') +
          '<div class="split">' +
            '<div class="box">' +
              '<div class="grid2">' +
                '<div class="f"><label>From</label><div class="in">Malmö C</div></div>' +
                '<div class="f"><label>To</label><div class="in">Helsingborg</div></div>' +
              '</div>' +
              '<div class="f"><label>Stops along the way</label>' +
                '<div class="grid3">' +
                  '<div class="in" style="text-align:center;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600">Lomma</div>' +
                  '<div class="in" style="text-align:center;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600">Bjärred</div>' +
                  '<div class="in" style="text-align:center;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600">Landskrona</div>' +
                '</div>' +
                '<span class="hint">Offered from the route Malmö C and Helsingborg both sit on.</span>' +
              '</div>' +
              '<div class="grid3">' +
                '<div class="f"><label>Date</label><div class="in">13 Sep 2026</div></div>' +
                '<div class="f"><label>Departure</label><div class="in">07:40</div></div>' +
                '<div class="f"><label>Free seats</label><div class="in">3</div></div>' +
              '</div>' +
              '<div class="f"><label>Note for passengers</label>' +
              '<div class="in soft">Non-smoking. Small bags only.</div></div>' +
              '<div class="r end"><a class="b sec" href="#/driver">Save draft</a><a class="b pri" href="#/trip">Publish</a></div>' +
            '</div>' +
            '<div class="box"><div class="tt">Preview</div>' + rt(STOPS) +
              '<span class="hint">Stop times are estimated from the route. The customer does not require a map.</span>' +
            '</div>' +
          '</div>' +
        '</div>');
    }
  });

  screen({
    path: '#/requests', group: 'Driver', label: 'Booking requests', url: 'samak.se/driver/requests',
    title: 'Booking requests', lede: 'Two requests on different parts of the same route. With three seats both fit — which is why a seat has to be counted per section, not per ride.',
    render: function () {
      function req(name, initials, when, from, to) {
        return '<div class="box">' +
          '<div class="ph"><div class="r"><span class="av">' + esc(initials) + '</span>' +
          '<div><div class="tt">' + esc(name) + '</div>' +
          '<div class="ss">Requested ' + esc(when) + '</div></div></div>' +
          '<span class="chip warn">1 seat</span></div>' +
          rt(STOPS, from, to) +
          '<div class="ph"><span class="ss">Takes a seat only between ' + esc(from) + ' and ' + esc(to) + '.</span>' +
          '<span class="r"><a class="b sec sm" href="#/requests">Decline</a>' +
          '<a class="b pri sm" href="#/trip">Accept</a></span></div>' +
          '</div>';
      }
      return app('requests', 'driver',
        '<div class="col wide">' +
          ph('Requests for Saturday', 'Malmö C → Helsingborg, departs 07:40',
            '<a class="b sec sm" href="#/driver">Back to trips</a>') +
          req('Alice Ek', 'AE', '2 hours ago', 'Malmö C', 'Helsingborg') +
          req('Oskar Lejon', 'OL', '40 minutes ago', 'Lomma', 'Landskrona') +
        '</div>');
    }
  });

  screen({
    path: '#/trip', group: 'Driver', label: 'Trip & passengers', url: 'samak.se/driver/trip/R-104',
    title: 'Trip and passengers', lede: 'The driver-side answer to "who am I travelling with": a pickup list in stop order, not an alphabetical list of names.',
    render: function () {
      var rows = [
        ['07:40', 'Malmö C', 'Alice Ek', ''],
        ['07:56', 'Lomma', 'Oskar Lejon', ''],
        ['08:04', 'Bjärred', '', ''],
        ['08:19', 'Landskrona', '', 'Tove Åkesson, Oskar Lejon'],
        ['08:41', 'Helsingborg', '', 'Alice Ek']
      ].map(function (m) {
        return '<tr><td class="m">' + esc(m[0]) + '</td><td>' + esc(m[1]) + '</td>' +
          '<td>' + (m[2] ? esc(m[2]) : '<span style="color:var(--faint)">—</span>') + '</td>' +
          '<td>' + (m[3] ? esc(m[3]) : '<span style="color:var(--faint)">—</span>') + '</td></tr>';
      }).join('');
      return app('trips', 'driver',
        '<div class="col wide">' +
          ph('Saturday 13 September', 'Malmö C → Helsingborg · three passengers',
            '<a class="b sec sm" href="#/driver">Cancel ride</a>') +
          '<div class="box">' + rt(STOPS) +
            '<div class="r"><span class="chip ok">1 of 3 seats free</span>' +
            '<span class="chip warn">Full between Lomma and Landskrona</span></div>' +
          '</div>' +
          '<div class="box"><div class="tt">Pickup order</div><table>' +
            '<thead><tr><th class="m">Time</th><th>Stop</th><th>Picks up</th><th>Drops off</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>' +
          '</div>' +
        '</div>');
    }
  });

  /* ---------- prototype shell ---------- */

  var ROUTES = {};
  SCREENS.forEach(function (s) { ROUTES[s.path] = s; });

  var rail = document.getElementById('rail');
  var main = document.getElementById('main');
  var path = '#/';

  (function buildRail() {
    var groups = [], by = {};
    SCREENS.forEach(function (s) {
      if (!by[s.group]) { by[s.group] = []; groups.push(s.group); }
      by[s.group].push(s);
    });
    rail.innerHTML = groups.map(function (g) {
      return '<div class="rail-group"><span class="rail-label">' + esc(g) + '</span>' +
        by[g].map(function (s) {
          return '<a href="' + s.path + '" data-path="' + s.path + '">' + esc(s.label) + '</a>';
        }).join('') + '</div>';
    }).join('');
  })();

  function indexView() {
    var tiles = SCREENS.filter(function (s) { return !s.index; }).map(function (s) {
      return '<a class="tile" href="' + s.path + '" style="display:flex;flex-direction:column;gap:3px;' +
        'text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:8px;' +
        'background:var(--card);padding:14px 16px">' +
        '<strong style="font-size:.95rem">' + esc(s.label) + '</strong>' +
        '<span style="font-size:.82rem;color:var(--muted)">' + esc(s.url || '') + '</span></a>';
    }).join('');
    return '<div class="wrap"><div class="caption"><h1>Screen designs</h1>' +
      '<p>Eleven screens, each drawn as it would look on a full display. Pick one from the list.</p></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px">' +
      tiles + '</div></div>';
  }

  function frameView(s) {
    return '<div class="wrap">' +
      '<div class="caption"><h1>' + esc(s.title) + '</h1><p>' + esc(s.lede) + '</p></div>' +
      '<div class="frame">' +
        '<div class="stage" id="stage">' +
          '<div class="screen' + (s.auth ? ' auth' : '') + '" id="screen">' + s.render() + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* The screen is drawn at 1280x820 and scaled down to whatever width there is,
     so what you see is the real layout rather than a squeezed one. */
  function fit() {
    var stage = document.getElementById('stage');
    var screen = document.getElementById('screen');
    if (!stage || !screen) { return; }
    var k = stage.clientWidth / 1280;
    screen.style.transform = 'scale(' + k + ')';
    stage.style.height = Math.round(820 * k) + 'px';
  }

  function render() {
    var s = ROUTES[path];
    main.innerHTML = s ? (s.index ? indexView() : frameView(s))
      : '<div class="wrap"><div class="caption"><h1>Not in this prototype</h1>' +
        '<p>Nothing here answers to that link. <a href="#/">Back to the list</a>.</p></div></div>';
    if (s && !s.index) { fit(); }
    Array.prototype.forEach.call(rail.querySelectorAll('a'), function (a) {
      if (a.getAttribute('data-path') === path) { a.setAttribute('aria-current', 'page'); }
      else { a.removeAttribute('aria-current'); }
    });
    document.title = (s && !s.index ? s.label + ' — ' : '') + 'Samåk Screens';
    main.focus();
    window.scrollTo(0, 0);
  }

  /* Capture phase, and the path is kept here rather than read from location.hash:
     embedded in a sandboxed frame neither the hash nor bubbled clicks are reliable. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
    e.preventDefault();
    e.stopPropagation();
    var next = a.getAttribute('href');
    if (next === path) { return; }
    path = next;
    render();
    try { if (location.hash !== next) { location.hash = next; } } catch (err) {}
  }, true);

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () {
    var h = location.hash;
    if (h && h !== path && ROUTES[h]) { path = h; render(); }
  });

  try { if (location.hash && ROUTES[location.hash]) { path = location.hash; } } catch (e) {}
  render();
})();
</script>
