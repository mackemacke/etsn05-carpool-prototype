<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samåk Route Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ETSN05 Team 2 — carpooling prototype
   Standalone stylesheet. No framework, no build step, no network needed.
   Tokens first; every component colour comes from a token so both themes resolve. */

:root {
  --ground:        #F1F5F5;
  --surface:       #FFFFFF;
  --surface-2:     #E6EDED;
  --surface-sunk:  #DCE6E7;
  --ink:           #12232B;
  --ink-2:         #4B626A;
  --ink-3:         #728890;
  --line:          #C9D7D9;
  --line-strong:   #A9BCBF;
  --primary:       #0E5A6B;
  --primary-soft:  #D6E7EA;
  --on-primary:    #FFFFFF;
  --accent:        #C57F14;
  --accent-soft:   #F6E6C8;
  --ok:            #2C6F4E;
  --ok-soft:       #D8EADF;
  --warn:          #94500F;
  --warn-soft:     #F7E4CE;
  --crit:          #9E2420;
  --crit-soft:     #F6DCDA;
  --focus:         #0E5A6B;

  --radius:        6px;
  --radius-lg:     10px;
  --shadow:        0 1px 2px rgba(18,35,43,.07), 0 8px 22px -14px rgba(18,35,43,.35);

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:    "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:       #0B161B;
    --surface:      #122229;
    --surface-2:    #1A313A;
    --surface-sunk: #0F1E24;
    --ink:          #E1EDF0;
    --ink-2:        #9BB2B9;
    --ink-3:        #7A929A;
    --line:         #26424B;
    --line-strong:  #355A65;
    --primary:      #4FADC2;
    --primary-soft: #14343E;
    --on-primary:   #06191F;
    --accent:       #E0A53F;
    --accent-soft:  #33270F;
    --ok:           #5EB98A;
    --ok-soft:      #12301F;
    --warn:         #D79A55;
    --warn-soft:    #33230F;
    --crit:         #E08A83;
    --crit-soft:    #3A1715;
    --focus:        #4FADC2;
    --shadow:       0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --ground:       #0B161B;
  --surface:      #122229;
  --surface-2:    #1A313A;
  --surface-sunk: #0F1E24;
  --ink:          #E1EDF0;
  --ink-2:        #9BB2B9;
  --ink-3:        #7A929A;
  --line:         #26424B;
  --line-strong:  #355A65;
  --primary:      #4FADC2;
  --primary-soft: #14343E;
  --on-primary:   #06191F;
  --accent:       #E0A53F;
  --accent-soft:  #33270F;
  --ok:           #5EB98A;
  --ok-soft:      #12301F;
  --warn:         #D79A55;
  --warn-soft:    #33230F;
  --crit:         #E08A83;
  --crit-soft:    #3A1715;
  --focus:        #4FADC2;
  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 16px/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.65rem; font-weight: 700; }
h2 { font-size: 1.2rem;  font-weight: 600; }
h3 { font-size: 1rem;    font-weight: 600; }
p  { margin: 0; }
a  { color: var(--primary); }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 50;
  background: var(--primary); color: var(--on-primary);
  padding: 10px 16px; border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num  { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .92em; }

.eyebrow {
  font-family: var(--display); font-size: .7rem; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
}

/* ---------- prototype banner ---------- */

.proto-banner {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  background: var(--accent-soft); color: var(--ink);
  border-bottom: 1px solid var(--line);
  padding: 7px 20px; font-size: .82rem;
}
.proto-banner strong {
  font-family: var(--display); text-transform: uppercase;
  letter-spacing: .12em; font-size: .68rem; color: var(--warn);
}

/* ---------- shell ---------- */

.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: auto 1fr; }

.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark {
  width: 22px; height: 22px; border-radius: 50%;
  border: 3px solid var(--primary);
  background: linear-gradient(to right, transparent 45%, var(--accent) 45%, var(--accent) 55%, transparent 55%);
}
.brand-text { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.02em; }
.brand-dim  { color: var(--ink-3); font-weight: 500; }

.topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.actor-switch {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface-2); border-radius: var(--radius); padding: 3px;
}
.actor-label {
  font-family: var(--display); font-size: .64rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); padding: 0 8px 0 6px;
}
.actor-btn {
  font: 600 .82rem/1 var(--body); color: var(--ink-2);
  background: none; border: 0; border-radius: 4px; padding: 7px 11px; cursor: pointer;
}
.actor-btn:hover { color: var(--ink); }
.actor-btn[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

.icon-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
  text-decoration: none;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.icon-btn svg { width: 20px; height: 20px; }
.bell-count {
  position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px;
  border-radius: 9px; background: var(--crit); color: #fff;
  font: 600 .68rem/18px var(--body); text-align: center; padding: 0 4px;
}

.ghost-btn {
  font: 600 .82rem/1 var(--body); color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 9px 12px; cursor: pointer;
}
.ghost-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.ghost-btn[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

/* ---------- rail nav ---------- */

.railnav {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 18px 12px 40px;
  overflow-y: auto;
  max-height: calc(100vh - 58px);
  position: sticky; top: 58px;
}
.rail-group { margin-bottom: 20px; }
.rail-group > .eyebrow { display: block; padding: 0 10px 7px; }
.rail-link {
  display: flex; align-items: baseline; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius);
  color: var(--ink-2); text-decoration: none; font-size: .88rem;
}
.rail-link:hover { background: var(--surface-2); color: var(--ink); }
.rail-link[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.rail-id { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); min-width: 22px; }
.rail-link[aria-current="page"] .rail-id { color: var(--primary); }

/* ---------- main ---------- */

.main { padding-block: 26px 64px; padding-left: 28px; padding-right: 28px; min-width: 0; }
.page { max-width: 1040px; display: flex; flex-direction: column; gap: 20px; }

.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head .lede { color: var(--ink-2); max-width: 62ch; }
.page-head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* ---------- surfaces ---------- */

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.panel-flat { background: none; border: 0; padding: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.row    { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row-end{ justify-content: flex-end; }
.stack  { display: flex; flex-direction: column; gap: 12px; }
.stack-s{ display: flex; flex-direction: column; gap: 5px; }

.divided > * + * { border-top: 1px solid var(--line); padding-top: 16px; }

/* ---------- buttons ---------- */

.btn {
  font: 600 .92rem/1 var(--body); border-radius: var(--radius);
  padding: 11px 16px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent;
}
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { border-color: var(--ink-3); }
.btn-danger { background: var(--crit-soft); color: var(--crit); border-color: var(--crit); }
.btn-quiet { background: none; color: var(--ink-2); padding: 11px 8px; }
.btn-quiet:hover { color: var(--ink); }
.btn-sm { padding: 7px 11px; font-size: .82rem; }

/* ---------- forms ---------- */

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-family: var(--display); font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: .78rem; color: var(--ink-3); }
.input, select.input, textarea.input {
  font: 400 .95rem/1.4 var(--body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--radius); padding: 10px 12px; width: 100%;
}
.input::placeholder { color: var(--ink-3); }
.field-error .input { border-color: var(--crit); background: var(--crit-soft); }
.error-text { font-size: .8rem; color: var(--crit); display: flex; gap: 6px; }

.choice-set { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.choice {
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  padding: 12px 14px; background: var(--surface); cursor: pointer;
  display: flex; flex-direction: column; gap: 3px; text-align: left;
}
.choice[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.choice strong { font-family: var(--display); font-size: .95rem; }
.choice span { font-size: .8rem; color: var(--ink-2); }

/* ---------- chips / badges ---------- */

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 .72rem/1 var(--body); letter-spacing: .02em;
  padding: 5px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
}
.chip-ok   { background: var(--ok-soft);   color: var(--ok); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-crit { background: var(--crit-soft); color: var(--crit); }
.chip-info { background: var(--primary-soft); color: var(--primary); }
.chip-seat { background: var(--accent-soft); color: var(--warn); font-family: var(--mono); }

/* ---------- corridor diagram (the route motif) ---------- */

.corridor-scroll { overflow-x: auto; padding-bottom: 4px; }
.corridor {
  list-style: none; margin: 0; padding: 8px 0 0;
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(96px, 1fr);
  min-width: 100%;
}
.stop {
  display: grid; grid-template-rows: auto 14px auto; justify-items: center;
  position: relative; padding: 0 4px; text-align: center;
}
.stop-time { font-family: var(--mono); font-size: .76rem; color: var(--ink-2); }
.stop-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--line-strong);
  align-self: center; z-index: 1;
}
.stop-name { font-size: .8rem; color: var(--ink-2); margin-top: 3px; }
.stop::after {
  content: ""; position: absolute; top: calc(50% - 1px); left: 50%; right: -50%;
  height: 2px; background: var(--line-strong);
}
.stop:last-child::after { display: none; }

.stop.on-leg .stop-dot { border-color: var(--accent); background: var(--accent); }
.stop.on-leg .stop-name { color: var(--ink); font-weight: 600; }
.stop.leg-line::after { background: var(--accent); height: 3px; top: calc(50% - 1.5px); }
.stop.endpoint .stop-dot { width: 13px; height: 13px; border-color: var(--primary); background: var(--primary); }

.corridor-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-3); }
.corridor-key span { display: inline-flex; align-items: center; gap: 6px; }
.key-swatch { width: 14px; height: 3px; border-radius: 2px; background: var(--line-strong); }
.key-swatch.leg { background: var(--accent); }

/* ---------- ride cards ---------- */

.ride {
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  background: var(--surface); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.ride-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.ride-who { display: flex; align-items: center; gap: 11px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary);
  display: grid; place-items: center;
  font: 600 .85rem/1 var(--display); flex: none;
}
.ride-meta { font-size: .82rem; color: var(--ink-2); }
.ride-when { text-align: right; }
.ride-when .t { font-family: var(--mono); font-size: 1.15rem; font-weight: 500; }
.ride-when .d { font-size: .78rem; color: var(--ink-3); }
.ride-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------- lists & tables ---------- */

.table-scroll { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.data th {
  font-family: var(--display); font-size: .7rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); text-align: left;
  padding: 0 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.data td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.num, table.data th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.itemlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.itemlist li { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.itemlist li:last-child { border-bottom: 0; }
.item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-title { font-weight: 600; }
.item-sub { font-size: .84rem; color: var(--ink-2); }

.notif { align-items: flex-start; text-decoration: none; color: inherit; }
.notif:hover .item-title { color: var(--primary); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex: none; }
.notif-dot.read { background: var(--line-strong); }

.kv { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 8px 18px; font-size: .9rem; }
.kv dt { color: var(--ink-3); font-family: var(--display); font-size: .78rem; font-weight: 600; padding-top: 2px; }
.kv dd { margin: 0; }

/* ---------- callouts ---------- */

.callout {
  border-left: 3px solid var(--line-strong); background: var(--surface-2);
  border-radius: 0 var(--radius) var(--radius) 0; padding: 13px 16px;
  display: flex; flex-direction: column; gap: 5px; font-size: .9rem;
}
.callout strong { font-family: var(--display); }
.callout-crit { border-left-color: var(--crit); background: var(--crit-soft); color: var(--crit); }
.callout-crit strong { color: var(--crit); }
.callout-warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout-info { border-left-color: var(--primary); background: var(--primary-soft); }

.empty {
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  padding: 34px 20px; border: 1px dashed var(--line-strong);
  border-radius: var(--radius-lg); background: var(--surface-sunk);
}

/* ---------- requirements overlay ---------- */

.reqpanel { display: none; }
body.show-req .reqpanel {
  display: flex; flex-direction: column; gap: 10px;
  border: 1px solid var(--accent); border-radius: var(--radius-lg);
  background: var(--accent-soft); padding: 15px 18px;
}
.reqpanel h3 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); }
.reqpanel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.reqpanel li { display: flex; gap: 10px; font-size: .86rem; align-items: baseline; }
.req-id { font-family: var(--mono); font-size: .78rem; color: var(--warn); min-width: 46px; flex: none; }
.wi-list { display: flex; flex-wrap: wrap; gap: 6px; }
.wi {
  font-family: var(--mono); font-size: .74rem; padding: 3px 7px; border-radius: 4px;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
  text-decoration: none;
}
.wi:hover { color: var(--primary); border-color: var(--primary); }

/* ---------- screen index ---------- */

.index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.index-card {
  display: flex; flex-direction: column; gap: 5px; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  background: var(--surface); padding: 14px 16px;
}
.index-card:hover { border-color: var(--primary); }
.index-card .idx { font-family: var(--mono); font-size: .74rem; color: var(--ink-3); }
.index-card strong { font-family: var(--display); font-size: .97rem; }
.index-card span { font-size: .82rem; color: var(--ink-2); }

/* ---------- responsive ---------- */

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .railnav {
    position: static; max-height: none; border-right: 0;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 14px; overflow-x: auto; padding: 10px 16px;
  }
  .rail-group { margin-bottom: 0; display: flex; align-items: center; gap: 6px; }
  .rail-group > .eyebrow { padding: 0 4px 0 0; white-space: nowrap; }
  .rail-link { white-space: nowrap; }
  .main { padding-left: 16px; padding-right: 16px; }
  .actor-label { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="proto-banner" role="note">
  <strong>Prototype</strong>
  <span>Navigation and layout only &mdash; nothing is stored and no data is real. ETSN05 Team 2, phase 1.</span>
</div>

<div class="shell">

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Sam&aring;k<span class="brand-dim">/prototype</span></span>
    </a>

    <div class="topbar-actions">
      <div class="actor-switch" role="group" aria-label="View as">
        <span class="actor-label">View as</span>
        <button type="button" class="actor-btn" data-actor="passenger" id="actor-passenger">Passenger</button>
        <button type="button" class="actor-btn" data-actor="driver" id="actor-driver">Driver</button>
        <button type="button" class="actor-btn" data-actor="admin" id="actor-admin">Admin</button>
      </div>

      <a class="icon-btn" href="#/notifications" aria-label="Notifications" id="bell">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a5 5 0 0 0-5 5v3.6L5.4 15.2A1 1 0 0 0 6.3 16.6h11.4a1 1 0 0 0 .9-1.4L17 11.6V8a5 5 0 0 0-5-5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="bell-count" id="bell-count">3</span>
      </a>

/* ===== js/components.js ===== */
/* Shared rendering helpers. Every view builds its markup from these so the
   repeated objects — ride cards, route diagrams, requirement panels — keep the
   same edges, baselines and inner padding from screen to screen. */

window.UI = (function () {

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pageHead(title, lede, aside) {
    return '' +
      '<header class="page-head">' +
        '<div class="page-head-row">' +
          '<div class="stack-s">' +
            '<h1>' + esc(title) + '</h1>' +
            (lede ? '<p class="lede">' + lede + '</p>' : '') +
          '</div>' +
          (aside ? '<div class="row">' + aside + '</div>' : '') +
        '</div>' +
      '</header>';
  }

  /* The route corridor. `legFrom`/`legTo` highlight one passenger's segment,
     which is the whole point of the drawing: it shows at a glance that a
     passenger may ride only part of the driver's route. */
  function corridor(stops, legFrom, legTo) {
    var fromIdx = -1, toIdx = -1;
    stops.forEach(function (s, i) {
      if (s.name === legFrom) { fromIdx = i; }
      if (s.name === legTo)   { toIdx = i; }
    });

    var items = stops.map(function (s, i) {
      var cls = ['stop'];
      if (i === 0 || i === stops.length - 1) { cls.push('endpoint'); }
      if (fromIdx > -1 && i >= fromIdx && i <= toIdx) { cls.push('on-leg'); }
      if (fromIdx > -1 && i >= fromIdx && i < toIdx)  { cls.push('leg-line'); }
      return '' +
        '<li class="' + cls.join(' ') + '">' +
          '<span class="stop-time">' + esc(s.time) + '</span>' +
          '<span class="stop-dot" aria-hidden="true"></span>' +
          '<span class="stop-name">' + esc(s.name) + '</span>' +
        '</li>';
    }).join('');

    var whole = fromIdx === 0 && toIdx === stops.length - 1;
    var key = fromIdx > -1
      ? '<div class="corridor-key">' +
          '<span><i class="key-swatch leg"></i> Your leg: ' + esc(legFrom) + ' &rarr; ' + esc(legTo) + '</span>' +
          (whole ? '' : '<span><i class="key-swatch"></i> Rest of the driver&rsquo;s route</span>') +
        '</div>'
      : '';

    return '<div class="corridor-scroll"><ol class="corridor">' + items + '</ol></div>' + key;
  }

  function seatChip(free, total) {
    var cls = free === 0 ? 'chip chip-crit' : (free === 1 ? 'chip chip-warn' : 'chip chip-ok');
    return '<span class="' + cls + '">' + free + ' of ' + total + ' seats free</span>';
  }

  function stateChip(state) {
    var map = {
      pending:   ['chip chip-warn', 'Awaiting driver'],
      confirmed: ['chip chip-ok',   'Confirmed'],
      completed: ['chip',           'Completed'],
      cancelled: ['chip chip-crit', 'Cancelled'],
      Active:    ['chip chip-ok',   'Active'],
      Suspended: ['chip chip-crit', 'Suspended']
    };
    var m = map[state] || ['chip', state];
    return '<span class="' + m[0] + '">' + esc(m[1]) + '</span>';
  }

  function rideCard(ride, legFrom, legTo, href) {
    var last = ride.stops[ride.stops.length - 1];
    var partial = legFrom && (legFrom !== ride.stops[0].name || legTo !== last.name);
    return '' +
      '<article class="ride">' +
        '<div class="ride-top">' +
          '<div class="ride-who">' +
            '<span class="avatar" aria-hidden="true">' + esc(ride.driver.initials) + '</span>' +
            '<div class="stack-s">' +
              '<strong>' + esc(ride.driver.name) + '</strong>' +
              '<span class="ride-meta">' + esc(ride.car) + ' &middot; ' +
                '<span class="num">' + esc(ride.driver.rating) + '</span> &middot; ' +
                '<span class="num">' + ride.driver.trips + '</span> trips</span>' +
            '</div>' +
          '</div>' +
          '<div class="ride-when">' +
            '<div class="t">' + esc(ride.stops[0].time) + '&ndash;' + esc(last.time) + '</div>' +
            '<div class="d">' + esc(ride.date) + ' &middot; ' + esc(ride.id) + '</div>' +
          '</div>' +
        '</div>' +
        corridor(ride.stops, legFrom, legTo) +
        '<div class="ride-foot">' +
          '<div class="row">' + seatChip(ride.seatsFree, ride.seatsTotal) +
            (partial ? '<span class="chip chip-info">Covers part of your journey</span>' : '') +
          '</div>' +
          (href ? '<a class="btn btn-secondary btn-sm" href="' + href + '">View ride</a>' : '') +
        '</div>' +
      '</article>';
  }

  /* The requirements overlay. Toggled from the top bar; hidden by default so a
     walkthrough stays about the screens, and one click away when the discussion
     turns to what the PRD has to say. */
  function req(ids, workItems) {
    var rows = ids.map(function (id) {
      var r = window.DATA.reqIndex[id];
      return '<li><span class="req-id">' + esc(id) + '</span><span>' +
        (r ? esc(r.text) : 'Unknown requirement') + '</span></li>';
    }).join('');

    var wis = (workItems || []).map(function (n) {
      return '<a class="wi" href="https://coursegit.cs.lth.se/etsn05-team-2/course-project/-/work_items/' +
        n + '" target="_blank" rel="noopener">#' + n + '</a>';
    }).join('');

    return '' +
      '<section class="reqpanel" aria-label="Requirements covered by this screen">' +
        '<h3>Draft requirements on this screen</h3>' +
        '<ul>' + rows + '</ul>' +
        (wis ? '<div class="wi-list"><span class="req-id">CourseGit</span>' + wis + '</div>' : '') +
      '</section>';
  }

  function page(parts) { return '<div class="page">' + parts.join('') + '</div>'; }

  return {
    esc: esc, page: page, pageHead: pageHead, corridor: corridor,
    rideCard: rideCard, seatChip: seatChip, stateChip: stateChip, req: req
  };
})();

          '<em>corridor</em>, and a partial leg is any contiguous run of stops along one. That assumption drives the route ' +
          'diagram on every ride screen — if the team rejects it, the search results and the driver manifest both change shape.</p>' +
        '</div>',
        sections,
        U.req(['4.4.2'], [])

  });

  screen({
    path: '#/requirements', code: '0R', group: 'Prototype', label: 'Draft requirements', actor: null,
    blurb: 'The numbered list the screens are traced against.',
    render: function () {
      function rows(kind) {
        return window.DATA.requirements.filter(function (r) { return r.kind === kind; })
          .map(function (r) {
            var on = O.filter(function (s) { return (s.reqs || []).indexOf(r.id) > -1; });
            var links = on.map(function (s) {
              return '<a href="' + s.path + '">' + U.esc(s.code) + '</a>';

            return '<tr><td class="num">' + U.esc(r.id) + '</td><td>' + U.esc(r.text) + '</td><td>' + links + '</td></tr>';
          }).join('');
      }

      function table(kind, caption) {
        return '<section class="panel stack">' +
          '<div class="panel-head"><h2>' + caption + '</h2></div>' +
          '<div class="table-scroll"><table class="data">' +
            '<thead><tr><th class="num">Req</th><th>Statement</th><th>Screens</th></tr></thead>' +
            '<tbody>' + rows(kind) + '</tbody>' +
          '</table></div>' +
        '</section>';
      }

      return U.page([
        U.pageHead(
          'Draft requirements',
          'Numbered the way the project guide requires: hierarchically, after the chapter the requirement sits in, ' +
          'functional separated from non-functional, and never renumbered once the PRD is in baseline. ' +
          'These are drafts written to give the prototype something to be traced against — they are not the PRD.',

          '<strong>Gaps the team still has to close</strong>' +
          '<p>Nothing here covers how a time is specified (exact departure, or a window), how the set of selectable ' +

          'booking when the driver changes the route after passengers have joined. Each is a requirement the customer ' +
          'asked for a proposal on, and each is currently missing.</p>' +
        '</div>'

    }
  });
})();

/* ===== js/app.js ===== */
/* Hash router + shell wiring. Small on purpose: the prototype exists to show
   screens and the paths between them, not to be an application. */

(function () {
  var ROUTES = window.ROUTES;
  var ORDER = window.SCREEN_ORDER;
  var U = window.UI;

  var main = document.getElementById('main');
  var rail = document.getElementById('railnav');

  /* ---- preferences (best effort; storage can be unavailable) ---- */

  function readPref(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function writePref(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  /* Only ever set the attribute, never clear it: when this page is embedded
     somewhere that stamps the viewer's own theme on the root element, clearing
     it would override their choice. With nothing stored we inherit
     prefers-color-scheme, which is the right default in both places. */
  var storedTheme = readPref('proto-theme');
  if (storedTheme === 'dark' || storedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', storedTheme);
  }

  if (readPref('proto-req') === '1') {
    document.body.classList.add('show-req');
    document.getElementById('req-toggle').setAttribute('aria-pressed', 'true');
  }

  /* ---- rail navigation ---- */

  function buildRail() {
    var groups = [];
    var byName = {};
    ORDER.forEach(function (s) {
      if (!byName[s.group]) { byName[s.group] = []; groups.push(s.group); }
      byName[s.group].push(s);
    });

    rail.innerHTML = groups.map(function (g) {
      var links = byName[g].map(function (s) {
        return '<a class="rail-link" href="' + s.path + '" data-path="' + s.path + '">' +
          '<span class="rail-id">' + U.esc(s.code) + '</span>' +
          '<span>' + U.esc(s.label) + '</span></a>';
      }).join('');
      return '<div class="rail-group"><span class="eyebrow">' + U.esc(g) + '</span>' + links + '</div>';
    }).join('');
  }

  /* ---- routing ---- */

  /* Navigation is driven by an internal variable, not by location.hash.
     Embedded in a sandboxed frame the hash is not always writable, and a router
     that depends on it silently stops navigating. The hash is still kept in
     sync when the host allows it, so deep links and the back button work where
     they can. */
  var path = '#/';

  function readHash() {
    try {
      var h = window.location.hash;
      return (!h || h === '#') ? null : h;
    } catch (e) { return null; }
  }

  function writeHash(next) {
    try {
      if (window.location.hash !== next) { window.location.hash = next; }
    } catch (e) { /* frame will not take it; the internal path still moved */ }
  }

  function go(next) {
    if (!next || next === path) { return; }
    path = next;
    render();
    writeHash(next);
  }

  function render() {
    var spec = ROUTES[path];

    if (!spec) {
      main.innerHTML = U.page([
        U.pageHead('Screen not drawn yet',
          'Nothing in this prototype answers to <code class="mono">' + U.esc(path) + '</code>. ' +
          'That is either a link typed by hand, or a flow the team has not designed — worth knowing which.'),
        '<div class="empty"><h2>Where to go instead</h2>' +
          '<a class="btn btn-primary" href="#/">Back to the screen index</a></div>'
      ]);
    } else {
      main.innerHTML = spec.render(path);
    }

    document.title = (spec && spec.label ? spec.label + ' — ' : '') + 'Samåk Route Prototype';

    Array.prototype.forEach.call(rail.querySelectorAll('.rail-link'), function (a) {
      if (a.getAttribute('data-path') === path) {
        a.setAttribute('aria-current', 'page');
      } else {
        a.removeAttribute('aria-current');
      }
    });

    var actor = spec && spec.actor;
    ['passenger', 'driver', 'admin'].forEach(function (name) {
      document.getElementById('actor-' + name)
        .setAttribute('aria-pressed', actor === name ? 'true' : 'false');
    });

    main.focus();
    window.scrollTo(0, 0);
  }

  /* ---- toggles ---- */

  var actorHome = {
    passenger: '#/search',
    driver: '#/driver',
    admin: '#/admin/users'
  };

  Object.keys(actorHome).forEach(function (name) {
    document.getElementById('actor-' + name).addEventListener('click', function () {
      go(actorHome[name]);
    });
  });

  /* Every in-page link is handled here rather than by the browser, for the
     same reason the router does not read the hash. Registered in the capture
     phase: an embedding page may have its own click handler that treats an
     anchor as an outbound link and stops the event before it reaches us. */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var a = t && t.closest ? t.closest('a[href^="#/"]') : null;
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
    e.preventDefault();
    e.stopPropagation();
    go(a.getAttribute('href'));
  }, true);

  document.getElementById('req-toggle').addEventListener('click', function () {
    var on = document.body.classList.toggle('show-req');
    this.setAttribute('aria-pressed', on ? 'true' : 'false');
    writePref('proto-req', on ? '1' : '0');
  });

  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    writePref('proto-theme', next);
  });

  /* Choice groups behave like radio buttons so a walkthrough can point at a
     selection without anything being saved. */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.choice') : null;
    if (!btn) { return; }
    var set = btn.parentNode;
    Array.prototype.forEach.call(set.querySelectorAll('.choice'), function (c) {
      c.setAttribute('aria-pressed', c === btn ? 'true' : 'false');
    });
  });

  document.getElementById('bell-count').textContent = window.DATA.unread();

  window.addEventListener('hashchange', function () {
    var h = readHash();
    if (h && h !== path) { path = h; render(); }
  });

  buildRail();
  path = readHash() || '#/';
  render();
})();

</script>
</body>
</html>
